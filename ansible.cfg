# Настройки визуализации вывода Ansible
[defaults]

# Используем стандартный плагин вывода
stdout_callback = default

# Форматируем результаты выполнения задач в читаемый 
# YAML вместо сплошного JSON (словари, логи, ошибки)
callback_result_format = yaml

# Включаем красивое форматирование для 
# структурированных данных и массивов
callback_format_pretty = true

[ssh_connection]

# Отправляем код модуля напрямую через stdin вместо 
# копирования временного файла на удалённый хост
pipelining = True

# Путь к сокету для переиспользуемого SSH-соединения,
# отдельный на каждый хост/порт/пользователя
control_path = ~/.ansible/cp/%%h-%%p-%%r

# Держим SSH-соединение открытым и переиспользуем его
# между тасками вместо нового подключения на каждый
ssh_args = -o ControlMaster=auto -o ControlPersist=60s