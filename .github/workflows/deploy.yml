name: Build & Push

on:
    workflow_dispatch:
    # push:
    #     branches: [main]

permissions:
    contents: read
    packages: write

jobs:
    build:
        name: Build & Push Docker images
        runs-on: ubuntu-latest

        # outputs джоба экспортирует переменную image_tag наружу — пригодится,
        # если после сборки нужно узнать тег образа не заходя в логи раннера.
        outputs:
            image_tag: ${{ steps.tag.outputs.sha }}

        steps:
            # Клонирует репозиторий на раннер. Без этого Git-история и файлы недоступны.
            - uses: actions/checkout@v4

            - name: Установить тег образа (короткий SHA)
              id: tag
              # `git rev-parse` --short HEAD -> возвращает первые 7 символов текущего коммита.
              # Запись в $GITHUB_OUTPUT — стандартный способ передать значение из шага в другие
              # шаги и в outputs джобы.
              run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

            # GitHub Container Registry
            - name: Login ghcr.io
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build & push backend
              uses: docker/build-push-action@v5
              with:
                  # Директория, которую Docker видит как build context
                  context: ./backend
                  # Путь к Dockerfile относительно корня репозитория
                  file: ./backend/Dockerfile
                  # После сборки сразу пушит в registry
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/htrbox-backend:${{ steps.tag.outputs.sha }}
                      ghcr.io/${{ github.repository_owner }}/htrbox-backend:latest

            - name: Build & push frontend
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./frontend/Dockerfile
                  target: prod
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/htrbox-frontend:${{ steps.tag.outputs.sha }}
                      ghcr.io/${{ github.repository_owner }}/htrbox-frontend:latest
