---
- name: Restore CORE Postgres database from local dump
  hosts: master
  gather_facts: false
  vars:
    restore_dump_src: ""
    restore_backup: ""
    restore_backups_dir: "{{ playbook_dir }}/../backups"
    restore_remote_dir: "{{ app_dir }}/restore"
    restore_timestamp: "{{ lookup('pipe', 'date +%Y_%m_%d_%H%M%S') }}"
    postgres_container: postgres
    restore_bootstrap_container: htrbox_restore_postgres
    postgres_image: postgres:17-alpine
    backend_container: backend
    postgres_db: vpn
    postgres_user: vpn
    postgres_password: "{{ lookup('env', 'POSTGRES_PASSWORD') }}"

  tasks:
    - name: Require restore dump selection
      assert:
        that:
          - restore_dump_src | length > 0 or restore_backup | length > 0
        fail_msg: >-
          Pass either a local dump path:
          -e restore_dump_src=/path/to/backups/dbdump_YYYY_MM_DD.sql
          or a backup file name from backups:
          -e restore_backup=dbdump_YYYY_MM_DD.sql

    - name: Resolve selected local dump
      set_fact:
        restore_selected_dump: "{{ restore_dump_src if (restore_dump_src | length > 0) else (restore_backups_dir ~ '/' ~ restore_backup) }}"

    - name: Resolve remote restore paths
      set_fact:
        restore_remote_dump: "{{ restore_remote_dir }}/{{ restore_selected_dump | basename }}"
        restore_safety_dump: "{{ restore_remote_dir }}/before_restore_{{ restore_timestamp }}.sql"

    - name: Check local dump file
      stat:
        path: "{{ restore_selected_dump }}"
      delegate_to: localhost
      register: local_restore_dump

    - name: Require existing local dump file
      assert:
        that:
          - local_restore_dump.stat.exists
          - local_restore_dump.stat.isreg
        fail_msg: "Local dump file does not exist: {{ restore_selected_dump }}"

    - name: Check Docker command
      raw: |
        command -v docker >/dev/null 2>&1
      register: docker_command
      changed_when: false
      failed_when: false

    - name: Install Docker when missing on Debian or Ubuntu
      become: true
      raw: |
        set -e
        if ! command -v apt-get >/dev/null 2>&1; then
          echo "Docker is missing and this host does not have apt-get. Install Docker first."
          exit 1
        fi
        apt-get update -qq
        apt-get install -y -qq docker.io
        apt-get install -y -qq docker-compose-plugin || true
        systemctl enable --now docker
      when: (docker_command.rc | default(1)) != 0

    - name: Check Docker service is running
      become: true
      raw: |
        set -e
        systemctl start docker
        systemctl is-active docker
      register: docker_service
      changed_when: false

    - name: Create CORE data directories
      become: true
      raw: |
        mkdir -p "{{ data_dir }}" "{{ data_dir }}/pgdata"
        chmod 0755 "{{ data_dir }}" "{{ data_dir }}/pgdata"

    - name: Create remote restore directory
      become: true 
      file:
        path: "{{ restore_remote_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"
        
    - name: Copy selected dump to CORE host
      shell: |
        set -e
        scp {{ ansible_ssh_common_args | default('') }} \
          -i {{ ansible_ssh_private_key_file | expanduser | quote }} \
          {{ restore_selected_dump | quote }} \
          {{ ansible_user | quote }}@{{ ansible_host | quote }}:{{ restore_remote_dump | quote }}
      delegate_to: localhost

    - name: Restrict remote dump permissions
      raw: |
        chmod 0600 "{{ restore_remote_dump }}"

    - name: Check Postgres container is running
      become: true
      raw: |
        docker inspect -f '{{ "{{" }}.State.Running{{ "}}" }}' {{ postgres_container }} 2>/dev/null || true
      register: postgres_running
      changed_when: false

    - name: Show restore mode
      debug:
        msg: >-
          Restore mode={{
            'running-postgres'
            if (postgres_running.stdout | trim) == 'true'
            else 'bootstrap-pgdata'
          }};
          postgres container running={{ postgres_running.stdout | trim | default('false', true) }}

    - name: Require Postgres password for bootstrap restore
      assert:
        that:
          - postgres_password | length > 0
        fail_msg: >-
          POSTGRES_PASSWORD is required when the main postgres container is not
          running, because the playbook must bootstrap a temporary Postgres
          container on {{ data_dir }}/pgdata.
      when: (postgres_running.stdout | trim) != "true"

    - name: Check backend container state
      become: true
      raw: |
        docker inspect -f '{{ "{{" }}.State.Running{{ "}}" }}' {{ backend_container }} 2>/dev/null || true
      register: backend_running
      changed_when: false

    - name: Restore into running application Postgres
      become: true
      block:
        - name: Create safety dump before restore
          raw: |
            set -eu
            docker exec {{ postgres_container }} pg_dump \
              -U {{ postgres_user }} \
              -d {{ postgres_db }} \
              --clean \
              --if-exists \
              --no-owner \
              --no-acl \
              > "{{ restore_safety_dump }}"
            chmod 0600 "{{ restore_safety_dump }}"

        - name: Stop backend during restore
          raw: |
            docker stop {{ backend_container }}
          when: (backend_running.stdout | trim) == "true"

        - name: Recreate and restore database
          raw: |
            set -eu
            docker exec {{ postgres_container }} psql \
              -v ON_ERROR_STOP=1 \
              -U {{ postgres_user }} \
              -d postgres \
              -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '{{ postgres_db }}' AND pid <> pg_backend_pid();"
            docker exec {{ postgres_container }} dropdb \
              -U {{ postgres_user }} \
              --if-exists \
              {{ postgres_db }}
            docker exec {{ postgres_container }} createdb \
              -U {{ postgres_user }} \
              {{ postgres_db }}
            docker exec -i {{ postgres_container }} psql \
              -v ON_ERROR_STOP=1 \
              -U {{ postgres_user }} \
              -d {{ postgres_db }} \
              < "{{ restore_remote_dump }}"

      always:
        - name: Start backend after restore
          raw: |
            docker start {{ backend_container }}
          when: (backend_running.stdout | trim) == "true"

      when: (postgres_running.stdout | trim) == "true"

    - name: Bootstrap pgdata with a temporary Postgres container
      become: true
      block:
        - name: Remove stale bootstrap Postgres container
          raw: |
            docker rm -f {{ restore_bootstrap_container }} >/dev/null 2>&1 || true

        - name: Start bootstrap Postgres on CORE pgdata
          raw: |
            set -eu
            export POSTGRES_PASSWORD={{ postgres_password | quote }}
            docker run -d \
              --name {{ restore_bootstrap_container }} \
              -e POSTGRES_DB={{ postgres_db }} \
              -e POSTGRES_USER={{ postgres_user }} \
              -e POSTGRES_PASSWORD \
              -v {{ data_dir }}/pgdata:/var/lib/postgresql/data \
              {{ postgres_image }}
          no_log: true

        - name: Wait for bootstrap Postgres readiness
          raw: |
            docker exec {{ restore_bootstrap_container }} pg_isready -U {{ postgres_user }} -d {{ postgres_db }}
          register: bootstrap_ready
          changed_when: false
          retries: 30
          delay: 2
          until: (bootstrap_ready.rc | default(1)) == 0

        - name: Recreate and restore database in bootstrap Postgres
          raw: |
            set -eu
            docker exec {{ restore_bootstrap_container }} psql \
              -v ON_ERROR_STOP=1 \
              -U {{ postgres_user }} \
              -d postgres \
              -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '{{ postgres_db }}' AND pid <> pg_backend_pid();"
            docker exec {{ restore_bootstrap_container }} dropdb \
              -U {{ postgres_user }} \
              --if-exists \
              {{ postgres_db }}
            docker exec {{ restore_bootstrap_container }} createdb \
              -U {{ postgres_user }} \
              {{ postgres_db }}
            docker exec -i {{ restore_bootstrap_container }} psql \
              -v ON_ERROR_STOP=1 \
              -U {{ postgres_user }} \
              -d {{ postgres_db }} \
              < "{{ restore_remote_dump }}"

      always:
        - name: Stop bootstrap Postgres container
          raw: |
            docker rm -f {{ restore_bootstrap_container }} >/dev/null 2>&1 || true

      when: (postgres_running.stdout | trim) != "true"

    - name: Show restore result
      debug:
        msg:
          - "Restored {{ restore_remote_dump }} into {{ postgres_db }} on {{ inventory_hostname }}"
          - "Target pgdata directory: {{ data_dir }}/pgdata"
          - "Safety dump saved on server when the main postgres container existed: {{ restore_safety_dump }}"
