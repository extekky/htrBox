#                   ДЕПЛОЙ CORE СЕРВЕРА И СИСТЕМЫ МОНИТОРИНГА 
#
# ЧТО ДЕЛАЕТ ЭТОТ ПЛЕЙБУК:
#  1. Автоматизирует полную развертку core сервера: frontend, backend,
#     postgreSQL, а также стек мониторинга (prometheus, grafana, alertmanager)
#  2. Проверяет наличие всех критически важных переменных и секретов из ENV
#  3. Готовит файловую структуру (папки для конфигураций, секретов и данных БД/мониторинга)
#  4. Рендерит конфигурационные файлы (.env, docker-compose, prometheus, nginx и т.д.)
#  5. Выпускает/обновляет SSL-сертификаты Let's Encrypt через Cloudflare DNS API
#     (логика вынесена в tasks/issue-certificate.yml, общий файл с deploy-nodes.yml)
#  6. Авторизуется в GHCR (GitHub Container Registry) и стягивает свежие Docker образы
#  7. Запускает контейнеры через docker-compose v2 и удаляет старые (dangling) образы
#  8. Healthcheck бэкенда через HTTP-запросы
#  9. Вторым play в этом же файле устанавливает node_exporter на все core-хосты
#     (логика вынесена в tasks/install-node-exporter.yml, общий файл с deploy-nodes.yml)
#
# ПЕРЕМЕННЫЕ:
# Общие для core и nodes — в group_vars/all.yml
# Специфичные для core (app_dir, secrets_dir, data_dir) — в group_vars/core.yml
# Секреты (пароли, токены) читаются из переменных окружения при запуске,
# см. блок vars в начале первого play.
#
# ВСЕ ИСПОЛЬЗУЕМЫЕ ТЕГИ (TAGS) И КАК ИХ ЗАПУСКАТЬ:
# Вы можете запускать отдельные части плейбука с помощью флага `--tags "tag_name"`
# > [always]      - Выполняется ВСЕГДА. Показывает информацию о целевом хосте.
# > [prepare]     - Подготовительный этап. Проверяет переменные окружения,
#                   устанавливает Docker (если его ещё нет), создает нужные
#                   директории и проверяет статус Docker.
# > [docker]      - Только установка/обновление Docker CE, без остального деплоя.
# > [env]         - Рендерит только основной файл окружения (.env) для приложений.
# > [certbot]     - Создает конфиг Cloudflare и вызывает процесс выпуска SSL-сертификата.
# > [monitoring]  - Все, что связано с мониторингом: создает папки с правильными
#                   UID/GID (Prometheus/Grafana), рендерит конфиги мониторинга
#                   и устанавливает node_exporter.
# > [status]      - Проверка состояния: статус Docker и список запущенных контейнеров.
# > [healthcheck] - Проверяет доступность эндпоинта /health бэкенда (до 10 попыток).
# > [deploy]      - ОСНОВНОЙ ТЕГ. Включает полный цикл развертывания (подготовка,
#                   генерация конфигов, логин в registry, запуск docker-compose,
#                   очистка старых images и healthcheck).
# > [node_exporter] - Только установка/обновление node_exporter, без остального деплоя.
#
# ПРИМЕРЫ КОМАНД ДЛЯ ЗАПУСКА:
# Полная развертка core:
#   ~$ ansible-playbook -i inventory.yml deploy-core.yml --tags deploy
# Только на конкретном core-сервере (если их станет несколько):
#   ~$ ansible-playbook -i inventory.yml deploy-core.yml --tags deploy --limit master
# Только выпустить сертификаты:
#   ~$ ansible-playbook -i inventory.yml deploy-core.yml --tags certbot
# Посмотреть логи основных сервисов:
#   ~$ ansible-playbook -i inventory.yml deploy-core.yml --tags logs
# Пересоздать только конфигурационные файлы и .env:
#   ~$ ansible-playbook -i inventory.yml deploy-core.yml --tags "env, monitoring"

---
- name: Deploy CORE (frontend + backend + postgres)
  hosts: core
  gather_facts: false
  vars:
    # -------------------------------------------------------
    #  lookup('env', 'VAR_NAME') — читает переменную окружения
    #  с машины, ОТКУДА запускается Ansible.
    #  Секреты передаются через env: вручную в терминале
    #  (export POSTGRES_PASSWORD=...) либо автоматически
    #  из GitHub Actions secrets.
    # -------------------------------------------------------
    email:              "{{ lookup('env', 'EMAIL') }}"
    image_tag:          "{{ lookup('env', 'IMAGE_TAG')  | default('latest', true) }}"
    ghcr_owner:         "{{ lookup('env', 'GHCR_OWNER') | default('extekky', true) | lower }}"
    jwt_secret:         "{{ lookup('env', 'JWT_SECRET') }}"
    cf_api_token:       "{{ lookup('env', 'CF_API_TOKEN') }}"
    hysteria_auth:      "{{ lookup('env', 'HYSTERIA_AUTH') }}"
    admin_username:     "{{ lookup('env', 'ADMIN_USERNAME') }}"
    admin_password:     "{{ lookup('env', 'ADMIN_PASSWORD') }}"
    monitoring_host:    "{{ lookup('env', 'MONITORING_HOST') | default('master', true) }}"
    telegram_chat_id:   "{{ lookup('env', 'TELEGRAM_CHAT_ID') }}"
    postgres_password:  "{{ lookup('env', 'POSTGRES_PASSWORD') }}"
    grafana_admin_user: "{{ lookup('env', 'GRAFANA_ADMIN_USER') | default('admin', true) }}"
    grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}"
    telegram_bot_token: "{{ lookup('env', 'TELEGRAM_BOT_TOKEN') }}"
    
    # Для ghcr_username и ghcr_token — два уровня fallback:
    # сначала кастомная переменная, если не задана — стандартная
    # переменная GitHub Actions (проставляется автоматически)
    ghcr_username:     "{{ lookup('env', 'GHCR_USERNAME') | default(lookup('env', 'GITHUB_ACTOR'), true) }}"
    ghcr_token:        "{{ lookup('env', 'GHCR_TOKEN') | default(lookup('env', 'GITHUB_TOKEN'), true) }}"
    certificate_domains:
      - "{{ service_domain }}"
      - "www.{{ service_domain }}"
      - "grafana.{{ service_domain }}"

  tasks:
    - name: Show CORE deployment target
      debug:
        msg: "Core target={{ inventory_hostname }} host={{ ansible_host }} image_tag={{ image_tag }}"
      tags: [always]

    - name: Check CORE required environment
      assert:
        that:
          - postgres_password | length > 0
          - jwt_secret | length >= 32
          - hysteria_auth | length > 0
          - admin_username | length > 0
          - admin_password | length > 0
          - cf_api_token | length > 0
          - email | length > 0
          - grafana_admin_password | length >= 16
        fail_msg: >-
          Core deploy environment is incomplete. Export POSTGRES_PASSWORD,
          JWT_SECRET (at least 32 chars), HYSTERIA_AUTH, ADMIN_USERNAME,
          ADMIN_PASSWORD, CF_API_TOKEN, EMAIL, and GRAFANA_ADMIN_PASSWORD
          (at least 16 chars) before running playbook.
      tags: [prepare, certbot, deploy]

    - name: Create CORE application directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ app_dir }}"
        - "{{ secrets_dir }}"
        - "{{ app_dir }}/monitoring"
        - "{{ app_dir }}/monitoring/rules"
        - "{{ app_dir }}/monitoring/grafana/provisioning/datasources"
      tags: [prepare, certbot, deploy, monitoring]

    - name: Create CORE Postgres data directory
      become: true
      file:
        path: "{{ data_dir }}/pgdata"
        state: directory
        mode: "0755"
      tags: [prepare, deploy]

    - name: Ensure official Docker CE is installed
      become: true
      import_tasks: tasks/install-docker.yml
      tags: [prepare, docker, deploy]

    - name: Create CORE monitoring data directories
      become: true
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "0755"
      loop:
        - path: "{{ data_dir }}/prometheus"
          owner: "65534"
          group: "65534"
        - path: "{{ data_dir }}/alertmanager"
          owner: "65534"
          group: "65534"
        - path: "{{ data_dir }}/grafana"
          owner: "472"
          group: "472"
      when: inventory_hostname == monitoring_host
      tags: [prepare, deploy, monitoring]

    - name: Render CORE environment file
      template:
        src: templates/infra.env.j2
        dest: "{{ app_dir }}/.env"
        mode: "0600"
      tags: [env, deploy]

    - name: Render CORE docker-compose.yaml
      template:
        src: templates/docker-compose.core.yaml.j2
        dest: "{{ app_dir }}/docker-compose.yaml"
        mode: "0644"
      tags: [deploy]

    - name: Copy CORE nginx config
      copy:
        src: ../frontend/nginx.conf
        dest: "{{ app_dir }}/nginx.conf"
        mode: "0644"
      tags: [deploy, monitoring]

    - name: Render CORE Prometheus config
      template:
        src: templates/prometheus.yml.j2
        dest: "{{ app_dir }}/monitoring/prometheus.yml"
        mode: "0644"
      when: inventory_hostname == monitoring_host
      tags: [deploy, monitoring]

    - name: Render CORE Alertmanager config
      template:
        src: templates/alertmanager.yml.j2
        dest: "{{ app_dir }}/monitoring/alertmanager.yml"
        mode: "0644"
      when: inventory_hostname == monitoring_host
      tags: [deploy, monitoring]

    - name: Copy CORE Prometheus alert rules
      copy:
        src: ../monitoring/rules/
        dest: "{{ app_dir }}/monitoring/rules/"
        mode: "0644"
      when: inventory_hostname == monitoring_host
      tags: [deploy, monitoring]

    - name: Render CORE Grafana Prometheus datasource
      template:
        src: templates/grafana-datasource-prometheus.yml.j2
        dest: "{{ app_dir }}/monitoring/grafana/provisioning/datasources/prometheus.yml"
        mode: "0644"
      when: inventory_hostname == monitoring_host
      tags: [deploy, monitoring]

    - name: Render CORE Cloudflare credentials
      template:
        src: templates/cloudflare.ini.j2
        dest: "{{ secrets_dir }}/cloudflare-core.ini"
        mode: "0600"
      tags: [certbot, deploy]

    - name: Check Docker on CORE
      shell: |
        set -e
        if command -v docker >/dev/null 2>&1; then
          docker --version
        else
          echo "docker_status=missing"
          exit 1
        fi
        systemctl is-active docker || true
      register: core_docker
      changed_when: false
      tags: [prepare, status, deploy]

    - name: Print CORE Docker status
      debug:
        var: core_docker.stdout_lines
      when: core_docker is defined
      tags: [prepare, status, deploy]

    - name: Check or issue CORE certificate
      become: true
      vars:
        cert_primary_domain: "{{ service_domain }}"
        cert_domains: "{{ certificate_domains }}"
        cert_cloudflare_ini: "{{ secrets_dir }}/cloudflare-core.ini"
      import_tasks: tasks/issue-certificate.yml
      tags: [certbot, deploy]

    - name: Check GHCR credentials
      assert:
        that:
          - ghcr_username | length > 0
          - ghcr_token | length > 0
        fail_msg: >-
          GHCR credentials are missing. For local deploy export GHCR_USERNAME and
          GHCR_TOKEN, or GITHUB_ACTOR and GITHUB_TOKEN. GHCR_TOKEN must be a
          GitHub token with permission to read packages.
      tags: [deploy]

    - name: Login CORE host to GHCR
      community.docker.docker_login:
        registry_url: ghcr.io
        username: "{{ ghcr_username }}"
        password: "{{ ghcr_token }}"
      no_log: true
      tags: [deploy]

    - name: Pull and start CORE containers
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        pull: always
        recreate: always
      register: core_compose
      tags: [deploy]

    - name: Show CORE compose output
      debug:
        var: core_compose.actions
      when: core_compose is defined
      tags: [deploy]

    - name: Remove unused CORE docker images
      community.docker.docker_prune:
        images: true
        images_filters:
          dangling: "true"
      tags: [deploy]

    - name: Show CORE container status
      debug:
        var: core_compose.containers
      when: core_compose is defined
      tags: [status, deploy]

    - name: Check CORE backend health
      shell: |
        curl -fsS http://127.0.0.1:8000/health
      register: core_health
      changed_when: false
      retries: 10
      delay: 3
      until: core_health.rc == 0
      tags: [healthcheck, deploy]

    - name: Print CORE backend health
      debug:
        var: core_health.stdout_lines
      when: core_health is defined
      tags: [healthcheck, deploy]

    # - name: Check CORE monitoring endpoints
    #   shell: |
    #     set -e
    #     curl -fsS http://127.0.0.1:9090/-/ready
    #     curl -fsS http://127.0.0.1:9090/api/v1/targets
    #     curl -fsS http://127.0.0.1:9093/-/ready
    #     curl -fsS https://grafana.{{ service_domain }}/api/health
    #   register: monitoring_health
    #   changed_when: false
    #   retries: 10
    #   delay: 3
    #   until: monitoring_health.rc == 0
    #   when: inventory_hostname == monitoring_host
    #   tags: [healthcheck, deploy, monitoring]

    # - name: Print CORE monitoring health
    #   debug:
    #     var: monitoring_health.stdout_lines
    #   when:
    #     - inventory_hostname == monitoring_host
    #     - monitoring_health is defined
    #   tags: [healthcheck, deploy, monitoring]


- name: Install node_exporter on CORE
  hosts: core
  gather_facts: false
  become: true
  vars:
    node_exporter_version: "1.8.2"
    monitoring_host:    "{{ lookup('env', 'MONITORING_HOST') | default('master', true) }}"
    monitoring_host_ip: "{{ hostvars[monitoring_host].ansible_host }}"

  tasks:
    - import_tasks: tasks/install-node-exporter.yml
      tags: [monitoring, node_exporter]

  handlers:
    - name: Restart node_exporter
      systemd:
        name: node_exporter
        state: restarted
        daemon_reload: true