# ------------------------------------------------------
#  tasks/install-node-exporter.yml
#
#  Общая логика установки Prometheus node_exporter.
#  Подключается через import_tasks из deploy-core.yml
#  и deploy-nodes.yml, чтобы не дублировать один и тот же
#  код в двух плейбуках.
#
#  Плейбук, который подключает этот файл, должен задать:
#    - become: true (на уровне play)
#    - node_exporter_version
#    - monitoring_host
#    - monitoring_host_ip
#
#  Идемпотентен: если нужная версия node_exporter уже
#  установлена, скачивание/распаковка/установка пропускаются.
# ------------------------------------------------------

- name: Create node_exporter system user
  user:
    name: node_exporter
    shell: /usr/sbin/nologin
    system: true
    create_home: false
  tags: [monitoring, node_exporter]

- name: Check installed node_exporter version
  command: /usr/local/bin/node_exporter --version
  register: node_exporter_installed
  changed_when: false
  failed_when: false
  tags: [monitoring, node_exporter]

- name: Set fact whether target node_exporter version is already installed
  set_fact:
    node_exporter_up_to_date: "{{ node_exporter_installed.rc == 0 and node_exporter_version in (node_exporter_installed.stdout + node_exporter_installed.stderr) }}"
  tags: [monitoring, node_exporter]

- name: Download node_exporter archive
  get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    mode: "0644"
  when: not node_exporter_up_to_date
  tags: [monitoring, node_exporter]

- name: Extract node_exporter archive
  unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
  when: not node_exporter_up_to_date
  tags: [monitoring, node_exporter]

- name: Install node_exporter binary
  copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    owner: node_exporter
    group: node_exporter
    mode: "0755"
    remote_src: true
  when: not node_exporter_up_to_date
  notify: Restart node_exporter
  tags: [monitoring, node_exporter]

- name: Install node_exporter systemd service
  copy:
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=node_exporter
      Group=node_exporter
      Type=simple
      ExecStart=/usr/local/bin/node_exporter
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  notify: Restart node_exporter
  tags: [monitoring, node_exporter]

- name: Enable and start node_exporter
  systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
  tags: [monitoring, node_exporter]

- name: Allow Prometheus host to scrape node_exporter when UFW exists
  shell: |
    if command -v ufw >/dev/null 2>&1; then
      ufw allow from {{ monitoring_host_ip }} to any port 9100 proto tcp
    else
      echo "ufw_status=missing"
    fi
  register: node_exporter_ufw
  changed_when: "'Rule added' in node_exporter_ufw.stdout or 'Rules updated' in node_exporter_ufw.stdout"
  tags: [monitoring, node_exporter, firewall]

- name: Allow local Docker bridge to scrape master node_exporter when UFW exists
  shell: |
    if command -v ufw >/dev/null 2>&1; then
      ufw allow from 172.16.0.0/12 to any port 9100 proto tcp
    else
      echo "ufw_status=missing"
    fi
  register: node_exporter_docker_ufw
  changed_when: "'Rule added' in node_exporter_docker_ufw.stdout or 'Rules updated' in node_exporter_docker_ufw.stdout"
  when: inventory_hostname == monitoring_host
  tags: [monitoring, node_exporter, firewall]