# ------------------------------------------------------
#  group_vars/all.yml
#  Переменные, общие для всех серверов.
#
#  Под all.vars — теперь Ansible подхватывает этот файл
#  автоматически по имени "all", без явных ссылок.
# ------------------------------------------------------

ansible_ssh_private_key_file: ~/.ssh/id_rsa

# -o StrictHostKeyChecking=no — отключает подтверждение при
# первом подключении к новому серверу.
# NOTE: в проде лучше использовать known_hosts вместо "no"
ansible_ssh_common_args: -o StrictHostKeyChecking=no

# Основной домен проекта. Используется как {{ service_domain }}
# например при выпуске SSL-сертификата.
service_domain: stdoq.ru

# Python interpreter for Ansible tasks
ansible_python_interpreter: auto_silent