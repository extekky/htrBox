# Переменные, общие для всех серверов.

# Дефолтный ключ для подключения к серверам
ansible_ssh_private_key_file: ~/.ssh/id_rsa

# Отключаем подтверждение при первом подключении к новому серверу
ansible_ssh_common_args: -o StrictHostKeyChecking=no

# Основной домен проекта
service_domain: stdoq.ru

# Python interpreter for Ansible tasks
ansible_python_interpreter: auto_silent
